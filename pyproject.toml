[project]
name = "ualens"
version = "0.1.0"
description = "Terminal User Interface OPC UA Explorer"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [{ name = "ualens contributors" }]
keywords = ["opc-ua", "opcua", "tui", "terminal", "textual", "explorer", "asyncua"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
    "Topic :: Terminals",
]
dependencies = [
    "asyncua>=1.2b1",
    "platformdirs>=4.0",
    "textual>=7.5.0",
    "textual-plotext>=0.2.1",
]

[project.urls]
Homepage = "https://pypi.org/project/ualens/"
Documentation = "https://github.com/ualens/ualens#readme"
Repository = "https://github.com/ualens/ualens"
Issues = "https://github.com/ualens/ualens/issues"

[project.scripts]
ualens = "ualens.main:main"
ualens-mock-server = "ualens.mock_server:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ualens"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
